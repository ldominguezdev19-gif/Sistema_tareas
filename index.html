<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Tareas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="card-form">
      <h1 class="titulo">Tareas Generales</h1>
      <p class="subtitle">Crea tus materias y asigna cada tarea a una.</p>
      <form id="materia">
        <label for="nombre-materia">Nueva materia: </label>
        <input type="text" name="nombre-materia" id="nombre-materia" required />
        <button class="btn-submit" id="btn-submit-materia" type="submit">
          Crear materia
        </button>
      </form>
      <form id="tarea">
        <label for="nombre-tarea">Ingresa la Tarea:</label>
        <input type="text" name="nombre-tarea" id="nombre-tarea" required />
        <select
          name="lista-materia"
          id="lista-materia"
          aria-label="materia de la tarea"
        ></select>
        <button class="btn-submit" id="btn-submit-tarea" type="submit">
          Agregar
        </button>
      </form>

      <div class="botones-filtro">
        <button class="activo" type="button" data-filtro="todos">Todos</button>
        <button type="button" data-filtro="pendientes">Pendientes</button>
        <button type="button" data-filtro="completadas">Completadas</button>
      </div>
      <div class="contenedor-materias" id="contenedor-materias">
        <!-- Prueba temporal: borrar cuando haga el JS-->
        <section class="materia">
          <h2>Mineria de Datos</h2>
          <ul>
            <li>
              <span class="texto">Escribir un ensayo</span>
              <div class="acciones">
                <button class="btn-eliminar">Eliminar</button>
              </div>
            </li>
            <li class="completada">
              <span class="texto">Taller evaluativo</span>
              <div class="acciones">
                <button class="btn-eliminar">Eliminar</button>
              </div>
            </li>
          </ul>
        </section>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
