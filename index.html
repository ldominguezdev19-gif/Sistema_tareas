<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Tareas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card-form">
        <h1 class="titulo">Tareas Generales</h1>
        <p class="subtitle">Crea tus materias y asigna cada tarea a una.</p>
        <form id="materia">
            <label for="nombre-materia">Nueva materia: </label>
            <input type="text" name="nombre-materia" id="nombre-materia" required>
            <button id="btn-submit-materia" type="submit">Agregar</button>
        </form>
        <form id="tarea">
            <label for="nombre-tarea">Ingresa la Tarea:</label>
            <input type="text" name="nombre-tarea" id="nombre-tarea" required>
            <button id="btn-submit-tarea" type="submit">Agregar</button>
        </form>
        <ul id="lista-tareas">  
        </ul>
        <button>Todos</button>
        <button>Pendientes</button>
        <button>Completadas</button>
    </div>
    <div class="contenedor-materias" id="contenedor-materias"></div>
<script src="script.js"></script>
</body>
</html>
